name: Release

# Locked in #25 / #27: semantic-release on main + npm trusted publishing (OIDC).
# The npm trusted-publisher registration names THIS exact workflow path —
# renaming the file breaks OIDC auth.
on:
  push:
    branches: [main]
    # Docs-only changes never need a lib release. A push that touches both
    # docs and lib still runs (paths-ignore only skips all-docs pushes).
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"

# Serialize releases; two merges racing semantic-release would double-publish.
concurrency: release

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # version-bump commit, v* tag, GitHub Release
      id-token: write # OIDC for npm trusted publishing (provenance is automatic)
      issues: write # semantic-release comments on resolved issues
      pull-requests: write # semantic-release comments on released PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node (semantic-release runtime + npm CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lib gates — typecheck, test, build
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Release (semantic-release)
        run: npx semantic-release
        env:
          # No NPM_TOKEN on purpose — auth is OIDC trusted publishing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
